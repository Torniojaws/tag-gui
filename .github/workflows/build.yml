name: Build and release

on:
  push:
    branches: [main]
    # A push that only touches these files is not released. Tests still run for every push
    # in tests.yml.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # The app version comes from src/tag_gui/__init__.py. When a release of it already
      # exists (a push without a version bump), the patch number goes up until it is free.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' src/tag_gui/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::No MAJOR.MINOR.PATCH __version__ in src/tag_gui/__init__.py"
            exit 1
          fi
          base=${version%.*}
          patch=${version##*.}
          while gh release view "v$base.$patch" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
            patch=$((patch + 1))
          done
          if [ "$base.$patch" != "$version" ]; then
            echo "::notice::Release v$version exists, publishing as v$base.$patch"
          fi
          echo "value=$base.$patch" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/tag-gui.exe
            asset: tag-gui-v${{ needs.version.outputs.value }}.exe
          - os: ubuntu-latest
            built: dist/tag-gui
            asset: tag-gui-v${{ needs.version.outputs.value }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # make_icon.py needs a Qt platform plugin, and the runners have no display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libpulse0

      - name: Install dependencies
        run: python build.py deps

      # An auto-bumped patch release must also show its own version inside the app.
      - name: Stamp the release version
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: sed -i -E "s/^__version__ = .*/__version__ = \"$VERSION\"/" src/tag_gui/__init__.py

      # The key and secret live in repository secrets, never in the repository itself.
      - name: Add the Last.fm API key
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [ -z "$LASTFM_API_KEY" ] || [ -z "$LASTFM_API_SECRET" ]; then
            echo "::warning::LASTFM_API_KEY / LASTFM_API_SECRET secrets are not set, so this build cannot scrobble"
            exit 0
          fi
          python -c "import os; open('src/tag_gui/_lastfm_keys.py', 'w').write('API_KEY = %r\nAPI_SECRET = %r\n' % (os.environ['LASTFM_API_KEY'], os.environ['LASTFM_API_SECRET']))"

      - name: Build executable
        run: python build.py build

      - name: Name executable after the version
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: >
          gh release create "v$VERSION" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "tag-gui v$VERSION"
          --notes "Automated Windows and Linux builds from $GITHUB_SHA."
          --latest
