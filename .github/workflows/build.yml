name: Build and release

on:
  push:
    branches: [main]
    # A push that only touches these files is not released. Tests still run for every push
    # in tests.yml.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # The app version comes from src/tag_gui/__init__.py. When a release of it already
      # exists (a push without a version bump), the patch number goes up until it is free.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' src/tag_gui/__init__.py)
          if [ -z "$version" ]; then
            echo "::error::No MAJOR.MINOR.PATCH __version__ in src/tag_gui/__init__.py"
            exit 1
          fi
          base=${version%.*}
          patch=${version##*.}
          while gh release view "v$base.$patch" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
            patch=$((patch + 1))
          done
          if [ "$base.$patch" != "$version" ]; then
            echo "::notice::Release v$version exists, publishing as v$base.$patch"
          fi
          echo "value=$base.$patch" >> "$GITHUB_OUTPUT"

  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # An empty container runs the job directly on the runner.
            container: ''
            built: dist/tag-gui.exe
            asset: tag-gui-v${{ needs.version.outputs.value }}.exe
          # The executable bundles libraries from the build system, so it only runs where glibc
          # is at least as new as there. AlmaLinux 9 (glibc 2.34 with 2.35 symbols backported)
          # is about the oldest system the PySide6 wheels (manylinux_2_34) install on, so the
          # build runs on Ubuntu 22.04, Debian 12, RHEL 9 and newer.
          - os: ubuntu-latest
            container: almalinux:9
            built: dist/tag-gui
            # Not ending in the version: file managers would read e.g. ".1" as a man page.
            asset: tag-gui-v${{ needs.version.outputs.value }}-linux-x86_64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      # make_icon.py needs a Qt platform plugin, and the runners have no display.
      QT_QPA_PLATFORM: offscreen
    steps:
      # Before checkout, so it clones with git instead of downloading an archive.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          dnf install -y git tar gzip \
            glib2 mesa-libEGL mesa-libGL dbus-libs fontconfig freetype gtk3 \
            libxkbcommon libxkbcommon-x11 libxcb xcb-util-cursor xcb-util-wm xcb-util-image \
            xcb-util-keysyms xcb-util-renderutil pulseaudio-libs
          dnf clean all

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
          cache: pip

      # AlmaLinux 9 has no Python 3.14 package. uv's standalone Python builds need only
      # glibc 2.17 and include the shared libpython that PyInstaller bundles.
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'Linux'

      - name: Install Python
        if: runner.os == 'Linux'
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv venv --seed --python 3.14 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: python build.py deps

      # An auto-bumped patch release must also show its own version inside the app.
      - name: Stamp the release version
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: sed -i -E "s/^__version__ = .*/__version__ = \"$VERSION\"/" src/tag_gui/__init__.py

      # The key and secret live in repository secrets, never in the repository itself.
      - name: Add the Last.fm API key
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [ -z "$LASTFM_API_KEY" ] || [ -z "$LASTFM_API_SECRET" ]; then
            echo "::warning::LASTFM_API_KEY / LASTFM_API_SECRET secrets are not set, so this build cannot scrobble"
            exit 0
          fi
          python -c "import os; open('src/tag_gui/_lastfm_keys.py', 'w').write('API_KEY = %r\nAPI_SECRET = %r\n' % (os.environ['LASTFM_API_KEY'], os.environ['LASTFM_API_SECRET']))"

      - name: Build executable
        run: python build.py build

      - name: Check the glibc requirement
        if: runner.os == 'Linux'
        run: python build.py glibc

      - name: Name executable after the version
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: >
          gh release create "v$VERSION" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "tag-gui v$VERSION"
          --notes "Automated Windows and Linux builds from $GITHUB_SHA."
          --latest
